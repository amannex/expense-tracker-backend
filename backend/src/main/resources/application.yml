spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:YourNewPassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: ${JWT_SECRET:local-development-secret-change-this-value}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
